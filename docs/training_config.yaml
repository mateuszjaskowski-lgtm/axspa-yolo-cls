# axSpA radiographic classification study

task: classify
mode: train
model: yolo11l-cls.pt
epochs: 240
patience: 240
batch: 100
imgsz: 640
save: true
device: 0
workers: 8
project: axspa-classification
name: yolo11l_cls_240ep
exist_ok: false
pretrained: true
optimizer: auto
verbose: true
seed: 0
deterministic: true
single_cls: false
rect: false
cos_lr: false
close_mosaic: 10
resume: false
